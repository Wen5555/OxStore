name: ${COMPOSE_PROJECT_NAME:-oxstore}
services:
  mysql:
    image: mysql:8.0.46
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请配置 DB_PASSWORD}
      MYSQL_DATABASE: shop
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -uroot -h 127.0.0.1 -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
  backend:
    image: oxstore/backend:${OXSTORE_VERSION:-0.1.0-docker.1}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?请配置 DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请配置 JWT_SECRET}
      TOKEN_LOOKUP_KEY: ${TOKEN_LOOKUP_KEY:?请配置 TOKEN_LOOKUP_KEY}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      HISTORY_COMPLETE_SINCE: ${HISTORY_COMPLETE_SINCE:-}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
  frontend:
    image: oxstore/frontend:${OXSTORE_VERSION:-0.1.0-docker.1}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  mysql_data:
  uploads:
